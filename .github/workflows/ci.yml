name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 编译 + 单元测试 + 集成测试（H2）+ 模块边界检查（ArchUnit）
      - run: mvn -B verify

  backend-mysql:
    name: 后端集成测试（MySQL 8）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # 覆盖测试配置中的 H2 连接，同一套集成测试在 MySQL 8 上再跑一遍（发现保留字、方言差异等 H2 测不出的问题）
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/erp_it?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sendFractionalSeconds=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 设置 MySQL 字符集与时区
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "ALTER DATABASE erp_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; SET GLOBAL time_zone = '+08:00';"
      - run: mvn -B verify

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: 前端端到端测试（Playwright）
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp-ui/package-lock.json
      - name: 构建并启动后端（H2 内存库）
        run: |
          mvn -B -q package -DskipTests
          ERP_PROFILE=h2 nohup java -jar erp-server/target/erp-server.jar > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health >/dev/null && break || sleep 2; done
      - name: 安装依赖与浏览器
        working-directory: erp-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 运行 E2E
        working-directory: erp-ui
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            erp-ui/test-results
            server.log
