# 前端静态页面 + /api 反向代理（docker compose 内部服务名 erp-server）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 附件上传上限（后端硬上限 512MB，实际上限由系统参数 sys.file.max-size-mb 控制）
    client_max_body_size 520m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://erp-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导入导出、数据任务、AI 问数可能耗时较长
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        # SSE（AI 流式输出、待办实时推送）：后端已发送 X-Accel-Buffering: no，这里不做压缩以免缓存流式响应
        gzip off;
    }

    # 接口文档
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://erp-server:8080;
        proxy_set_header Host $host;
    }

    # 构建产物带哈希，长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
