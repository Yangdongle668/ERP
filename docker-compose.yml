# 一键部署：MySQL 8 + 后端（Spring Boot）+ 前端（Nginx）。配置见 .env（由 deploy.sh 从 .env.example 生成）
name: erp

# 容器日志轮转（json-file，每个容器最多约 250MB）；集中日志可改用 loki / fluentd 驱动
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${ERP_DB_NAME:-erp}
      MYSQL_USER: ${ERP_DB_USER:-erp}
      MYSQL_PASSWORD: ${ERP_DB_PASSWORD:?请在 .env 中设置 ERP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD:?请在 .env 中设置 ERP_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      # 内存占用（小内存服务器由 deploy.sh 自动调低）
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-ON}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      start_period: 60s
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  erp-server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: erp-server:${ERP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ERP_PROFILE: mysql
      ERP_DB_HOST: mysql
      ERP_DB_PORT: "3306"
      ERP_DB_NAME: ${ERP_DB_NAME:-erp}
      ERP_DB_USER: ${ERP_DB_USER:-erp}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?请在 .env 中设置 ERP_JWT_SECRET}
      ERP_SECRET_KEY: ${ERP_SECRET_KEY:-}
      ERP_METRICS_TOKEN: ${ERP_METRICS_TOKEN:-}
      ERP_API_DOCS_ENABLED: ${ERP_API_DOCS_ENABLED:-false}
      ERP_AI_API_KEY: ${ERP_AI_API_KEY:-}
      ERP_AI_BASE_URL: ${ERP_AI_BASE_URL:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8}
      # 健康检查不包含邮件服务器（邮件在 docker-compose.override.yml 中配置，见 README）
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    volumes:
      - erp-data:/app/data

  erp-ui:
    build:
      context: .
      dockerfile: deploy/ui.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: erp-ui:${ERP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      erp-server:
        condition: service_healthy
    ports:
      - "${ERP_HTTP_PORT:-80}:80"

volumes:
  mysql-data:
  erp-data:
