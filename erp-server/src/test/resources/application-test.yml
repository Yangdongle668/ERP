spring:
  datasource:
    url: jdbc:h2:mem:erp-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,YEAR,MONTH;DB_CLOSE_DELAY=-1
    username: sa
    password:
erp:
  # 测试不访问外网：天气接口指向本机关闭的端口，立即失败
  weather:
    url: http://127.0.0.1:9/v1/forecast
  monitoring:
    metrics-token: test-metrics-token
  file:
    local-path: ${java.io.tmpdir}/erp-it-files
  security:
    force-default-password-change: false
  backup:
    path: ${java.io.tmpdir}/erp-it-backups
    settle-millis: 0
  fx:
    poll-enabled: false
