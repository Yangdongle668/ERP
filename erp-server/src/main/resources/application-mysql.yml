spring:
  datasource:
    url: jdbc:mysql://${ERP_DB_HOST:localhost}:${ERP_DB_PORT:3306}/${ERP_DB_NAME:erp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${ERP_DB_USER:erp}
    password: ${ERP_DB_PASSWORD:erp}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
