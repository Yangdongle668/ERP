<style>
  h1 { font-size: 16pt; text-align: center; margin: 0 0 8pt; letter-spacing: 2pt; }
  .head { width: 100%; margin-bottom: 8pt; font-size: 10pt; }
  .lines { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  .lines th, .lines td { border: 1px solid #333; padding: 4pt; }
  .lines th { background: #f2f2f2; }
  .num { text-align: right; }
  .blank { width: 70pt; }
  .sign { margin-top: 16pt; width: 100%; font-size: 10pt; }
</style>
<h1>盘点表</h1>
<table class="head"><tr><td>盘点单号：{{docNo}}</td><td>日期：{{formatDate docDate}}</td><td>仓库：{{warehouseNames}}</td><td>盲盘：{{blindCount}}</td></tr></table>
<table class="lines">
  <thead><tr><th>#</th><th>仓库</th><th>库位</th><th>物料编码</th><th>名称</th><th>规格</th><th>单位</th><th>批次</th><th>账面数量</th><th>实盘数量</th><th>备注</th></tr></thead>
  <tbody>
    {{#each lines}}
    <tr><td>{{lineNo}}</td><td>{{warehouseName}}</td><td>{{locationCode}}</td><td>{{code}}</td><td>{{name}}</td><td>{{spec}}</td><td>{{uom}}</td>
      <td>{{batchNo}}</td><td class="num">{{#if bookQty}}{{formatQty bookQty}}{{/if}}</td><td class="blank"></td><td class="blank"></td></tr>
    {{/each}}
  </tbody>
</table>
<table class="sign"><tr><td>盘点人：</td><td>复核人：</td><td>日期：</td></tr></table>
